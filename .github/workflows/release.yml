name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate release version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag must have the form v1.2.3."
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Publish self-contained browser
        shell: pwsh
        run: dotnet publish .\QuickBrowse.csproj -c Release -r win-x64 --self-contained true "/p:Version=$env:RELEASE_VERSION"

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not installed."
          }
          & $compiler "/DMyAppVersion=`"$env:RELEASE_VERSION`"" ".\QuickBrowse.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" ".\installer\QuickBrowse-Setup-$env:RELEASE_VERSION.exe" --title "QuickBrowse $env:RELEASE_VERSION" --generate-notes
